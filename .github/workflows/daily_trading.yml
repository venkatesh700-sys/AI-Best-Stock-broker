name: AI Stock Trader Daily Automation

on:
  schedule:
    # 9:15 AM IST (03:45 UTC) Mon-Fri
    - cron: '45 3 * * 1-5'
    # 4:00 PM IST (10:30 UTC) Mon-Fri
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution Mode'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - evening
          - intraday_search
          - swing_search

jobs:
  trade_and_learn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests beautifulsoup4

      - name: Determine Execution Mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "EXEC_MODE=${{ github.event.inputs.mode }}" >> $GITHUB_ENV
          else
            CURRENT_HOUR=$(date -u +%H)
            if [ "$CURRENT_HOUR" -lt "08" ]; then
              echo "EXEC_MODE=morning" >> $GITHUB_ENV
            else
              echo "EXEC_MODE=evening" >> $GITHUB_ENV
            fi
          fi

      - name: Execute Swarm Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py --mode $EXEC_MODE

      - name: Commit & Push Dynamic Data Updates
        run: |
          git config --global user.name "AI-Stock-Trader-Bot"
          git config --global user.email "bot@github-actions.local"
          git add data/
          git commit -m "Auto-update trade memory bank and models [mode: $EXEC_MODE]" || echo "No changes to commit"
          git push
